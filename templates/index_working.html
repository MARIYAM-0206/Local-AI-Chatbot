<!DOCTYPE html>
<html>
<head>
<title>Local AI Chatbot</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.app{width:90%;max-width:800px;background:#172033;padding:30px;border-radius:20px}
input{width:75%;padding:15px;border-radius:10px;border:0}
button{padding:15px;border:0;border-radius:10px;background:#6366f1;color:white}
#chat{min-height:300px;margin-bottom:20px}
</style>
</head>
<body>
<div class="app">
<h1>🤖 Local AI Chatbot</h1>
<p>Qwen 2.5 1.5B · Ollama</p>
<div id="chat">
<p>🧠 Chat with your local AI</p>
</div>
<input id="message" placeholder="Ask me anything...">
<button onclick="send()">Send</button>
</div>

<script>
async function send(){
let input=document.getElementById("message");
let chat=document.getElementById("chat");
let msg=input.value.trim();
if(!msg)return;
chat.innerHTML+="<p><b>You:</b> "+msg+"</p>";
input.value="";
chat.innerHTML+="<p id='thinking'><b>Qwen:</b> Thinking...</p>";

let r=await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:msg})
});

let data=await r.json();
document.getElementById("thinking").innerHTML="<b>Qwen:</b> "+data.response;
}
</script>
</body>
</html>
