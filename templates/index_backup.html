<!DOCTYPE html>
<html>
<head>
    <title>Local AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        #chat {
            background: #1f2937;
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
            margin-bottom: 15px;
            overflow-y: auto;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .user {
            background: #374151;
        }

        .bot {
            background: #111827;
            border: 1px solid #4b5563;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 Local AI Chatbot</h1>

        <div id="chat"></div>

        <div class="input-area">
            <input
                id="message"
                type="text"
                placeholder="Ask something..."
                onkeydown="if(event.key === 'Enter') sendMessage()"
            >
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("message");
            const chat = document.getElementById("chat");
            const message = input.value.trim();

            if (!message) return;

            chat.innerHTML += `
                <div class="message user">
                    <strong>You:</strong> ${message}
                </div>
            `;

            input.value = "";

            chat.innerHTML += `
                <div class="message bot" id="thinking">
                    <strong>Qwen:</strong> Thinking...
                </div>
            `;

            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();

            document.getElementById("thinking").innerHTML =
                "<strong>Qwen:</strong> " + data.response;

            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
