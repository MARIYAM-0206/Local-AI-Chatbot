<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #080b12;
            --panel: #0f1420;
            --panel-2: #151b29;
            --border: rgba(255,255,255,0.08);
            --text: #f8fafc;
            --muted: #8b95a7;
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --green: #22c55e;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, Helvetica, sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(99,102,241,0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(139,92,246,0.12),
                    transparent 30%
                ),
                var(--bg);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .app {
            width: 100%;
            max-width: 1000px;
            height: min(850px, 92vh);

            display: flex;
            flex-direction: column;

            background: rgba(15,20,32,0.94);

            border: 1px solid var(--border);
            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.55),
                0 0 0 1px rgba(255,255,255,0.02);

            backdrop-filter: blur(18px);
        }

        .header {
            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 16px 22px;

            border-bottom: 1px solid var(--border);

            background: rgba(15,20,32,0.92);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            font-size: 22px;

            background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent-2)
            );

            box-shadow:
                0 8px 25px rgba(99,102,241,0.3);
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 7px 11px;

            border-radius: 999px;

            color: #86efac;

            background: rgba(34,197,94,0.08);

            border: 1px solid rgba(34,197,94,0.15);

            font-size: 11px;
            font-weight: 600;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow: 0 0 10px rgba(34,197,94,0.7);
        }

        #chat {
            flex: 1;

            overflow-y: auto;

            padding: 32px 30px;

            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar {
            width: 7px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat::-webkit-scrollbar-thumb {
            background: #283244;
            border-radius: 20px;
        }

        .welcome {
            max-width: 600px;

            margin: 80px auto;

            text-align: center;
        }

        .welcome-icon {
            width: 68px;
            height: 68px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            font-size: 32px;

            background: linear-gradient(
                135deg,
                rgba(99,102,241,0.2),
                rgba(139,92,246,0.15)
            );

            border: 1px solid rgba(139,92,246,0.2);
        }

        .welcome h1 {
            font-size: 28px;

            letter-spacing: -0.7px;

            margin-bottom: 12px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.7;

            font-size: 14px;

            max-width: 500px;

            margin: auto;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 10px;

            margin-top: 25px;

            flex-wrap: wrap;
        }

        .feature {
            padding: 8px 12px;

            border-radius: 999px;

            font-size: 11px;

            color: #aeb7c7;

            background: rgba(255,255,255,0.035);

            border: 1px solid var(--border);
        }

        .message {
            display: flex;

            margin-bottom: 22px;

            animation: appear 0.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 78%;
        }

        .sender {
            font-size: 10px;

            color: var(--muted);

            margin-bottom: 6px;

            font-weight: 600;
        }

        .user .sender {
            text-align: right;
        }

        .bubble {
            padding: 13px 16px;

            border-radius: 17px;

            font-size: 14px;

            line-height: 1.65;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .user .bubble {
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            border-bottom-right-radius: 5px;

            box-shadow:
                0 8px 25px rgba(79,70,229,0.18);
        }

        .bot .bubble {
            background: var(--panel-2);

            border: 1px solid var(--border);

            border-bottom-left-radius: 5px;
        }

        .thinking {
            color: var(--muted);
            font-style: italic;
        }

        .input-section {
            padding: 16px 20px 18px;

            border-top: 1px solid var(--border);

            background: rgba(15,20,32,0.96);
        }

        .input-wrapper {
            display: flex;

            align-items: center;

            gap: 10px;

            padding: 6px;

            background: #0b101a;

            border: 1px solid #252e3e;

            border-radius: 16px;

            transition: 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: rgba(99,102,241,0.7);

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.1);
        }

        #message {
            flex: 1;

            min-width: 0;

            padding: 12px;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 14px;
        }

        #message::placeholder {
            color: #596579;
        }

        #send {
            padding: 11px 18px;

            border: none;

            border-radius: 11px;

            color: white;

            font-weight: 700;

            font-size: 13px;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent-2)
            );

            transition: 0.2s;
        }

        #send:hover {
            transform: translateY(-1px);

            box-shadow:
                0 7px 20px rgba(99,102,241,0.3);
        }

        #send:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        .footer {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 9px 3px 0;
        }

        .privacy {
            color: #586477;

            font-size: 10px;
        }

        #clear {
            border: none;

            background: transparent;

            color: #718096;

            font-size: 10px;

            cursor: pointer;

            padding: 4px 6px;
        }

        #clear:hover {
            color: white;
        }

        @media (max-width: 650px) {

            body {
                padding: 0;
            }

            .app {
                width: 100%;
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }

            .header {
                padding: 15px;
            }

            .status {
                display: none;
            }

            #chat {
                padding: 24px 15px;
            }

            .welcome {
                margin: 60px auto;
            }

            .welcome h1 {
                font-size: 24px;
            }

            .message-content {
                max-width: 88%;
            }

            .input-section {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                🤖
            </div>

            <div>

                <div class="title">
                    Local AI Chatbot
                </div>

                <div class="subtitle">
                    Qwen 2.5 1.5B · Ollama
                </div>

            </div>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            Local AI

        </div>

    </header>

    <main id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                🧠
            </div>

            <h1>
                Chat with your local AI
            </h1>

            <p>
                A lightweight AI assistant running directly
                on your computer using Ollama and Qwen.
            </p>

            <div class="features">

                <span class="feature">
                    🔒 Private
                </span>

                <span class="feature">
                    ⚡ Local inference
                </span>

                <span class="feature">
                    ☁️ No cloud API
                </span>

            </div>

        </div>

    </main>

    <section class="input-section">

        <div class="input-wrapper">

            <input
                id="message"
                type="text"
                placeholder="Message your local AI..."
                autocomplete="off"
            >

            <button
                id="send"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

        <div class="footer">

            <span class="privacy">
                🔒 Runs locally on your computer
            </span>

            <button
                id="clear"
                onclick="clearChat()"
            >
                Clear chat
            </button>

        </div>

    </section>

</div>

<script>

const input = document.getElementById("message");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("send");

let welcome = document.getElementById("welcome");

/*
    Conversation history.

    Each item contains:
    {
        role: "user" or "assistant",
        content: "message"
    }
*/
let chatHistory = [];


function addMessage(sender, text, type) {

    if (welcome) {
        welcome.remove();
        welcome = null;
    }

    const message = document.createElement("div");

    message.className = "message " + type;

    const content = document.createElement("div");

    content.className = "message-content";

    const senderLabel = document.createElement("div");

    senderLabel.className = "sender";

    senderLabel.textContent = sender;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    content.appendChild(senderLabel);

    content.appendChild(bubble);

    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return bubble;
}


function buildConversationPrompt() {

    let prompt = `
You are a helpful AI assistant.

Below is the conversation between the user and the assistant.

Use the conversation history to understand follow-up questions and answer naturally.

`;

    for (const item of chatHistory) {

        if (item.role === "user") {

            prompt += "\nUser: " + item.content;

        } else {

            prompt += "\nAssistant: " + item.content;
        }
    }

    prompt += "\nAssistant:";

    return prompt;
}


async function sendMessage() {

    const message = input.value.trim();

    if (!message || sendButton.disabled) {
        return;
    }

    addMessage(
        "You",
        message,
        "user"
    );

    input.value = "";

    /*
        Save the user's message.
    */
    chatHistory.push({
        role: "user",
        content: message
    });

    sendButton.disabled = true;

    sendButton.textContent = "Thinking...";

    const thinkingBubble = addMessage(
        "Qwen",
        "Generating a response...",
        "bot"
    );

    thinkingBubble.classList.add("thinking");


    try {

        /*
            Build a prompt containing the previous
            conversation so Qwen has context.
        */
        const conversationPrompt =
            buildConversationPrompt();


        const response = await fetch(
            "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: conversationPrompt
                })
            }
        );


        const data = await response.json();


        thinkingBubble.classList.remove("thinking");


        const answer =
            data.response ||
            "No response received.";


        thinkingBubble.textContent = answer;


        /*
            Save Qwen's answer so the next
            question has the full conversation.
        */
        chatHistory.push({
            role: "assistant",
            content: answer
        });


    } catch (error) {

        thinkingBubble.classList.remove("thinking");

        thinkingBubble.textContent =
            "Could not connect to the local AI server.";

    }


    sendButton.disabled = false;

    sendButton.textContent = "Send";

    input.focus();

    chat.scrollTop = chat.scrollHeight;
}


function clearChat() {

    chatHistory = [];

    chat.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                🧠
            </div>

            <h1>
                Chat with your local AI
            </h1>

            <p>
                A lightweight AI assistant running directly
                on your computer using Ollama and Qwen.
            </p>

            <div class="features">

                <span class="feature">
                    🔒 Private
                </span>

                <span class="feature">
                    ⚡ Local inference
                </span>

                <span class="feature">
                    ☁️ No cloud API
                </span>

            </div>

        </div>
    `;

    welcome =
        document.getElementById("welcome");

    input.focus();
}


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);

</script>

</body>
</html>
